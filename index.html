<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VICTORY Loeding</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Bebas+Neue&display=swap');

  :root{
    --bg: #000000;
    --panel: #0a0a0a;
    --panel-2: #131313;
    --line: #2b2b2b;
    --text: #ffffff;
    --muted: #8a8a8a;
    --accent: #ffffff;
    --accent-dim: #cfcfcf;
    --warn: #cfcfcf;
    --danger: #ff5c5c;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Sarabun', system-ui, sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* faint moving scanlines behind everything, kept subtle */
  body::before{
    content: '';
    position: fixed;
    inset: -50%;
    background-image: repeating-linear-gradient(
      115deg,
      rgba(255,255,255,0.028) 0px,
      rgba(255,255,255,0.028) 1px,
      transparent 1px,
      transparent 64px
    );
    animation: driftLines 22s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes driftLines{
    from{ transform: translate(0,0); }
    to{ transform: translate(64px, 64px); }
  }

  .stage{ width:100%; max-width: 460px; position: relative; z-index: 1; }
  .stage.wide{ max-width: 860px; }

  .stage.entering{ animation: stageIn .5s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes stageIn{
    from{ opacity: 0; transform: translateY(14px) scale(.985); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ---------- Loading ---------- */
  #screen-loading{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    text-align:center;
  }
  .victory-mark{
    font-family: 'Bebas Neue', 'Sarabun', sans-serif;
    font-size: 64px;
    letter-spacing: 6px;
    line-height: 1;
    color: #fff;
    position: relative;
    animation: markPulse 2.4s ease-in-out infinite;
  }
  .victory-mark::before,
  .victory-mark::after{
    content: 'VICTORY';
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    opacity: 0.8;
  }
  .victory-mark::before{
    color: #ffffff;
    animation: glitchTop 3.6s infinite;
    clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
  }
  .victory-mark::after{
    color: #ffffff;
    animation: glitchBottom 3.6s infinite;
    clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
  }
  @keyframes markPulse{
    0%, 100%{ text-shadow: 0 0 0 rgba(255,255,255,0); }
    50%{ text-shadow: 0 0 26px rgba(255,255,255,0.55); }
  }
  @keyframes glitchTop{
    0%, 92%, 100%{ transform: translate(0,0); }
    93%{ transform: translate(-3px,-1px); }
    95%{ transform: translate(3px,1px); }
    97%{ transform: translate(-2px,0); }
  }
  @keyframes glitchBottom{
    0%, 92%, 100%{ transform: translate(0,0); }
    93%{ transform: translate(3px,1px); }
    95%{ transform: translate(-3px,-1px); }
    97%{ transform: translate(2px,0); }
  }

  .loading-bar{
    width: 220px;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .loading-bar::after{
    content: '';
    position: absolute;
    left: -40%;
    top: 0;
    width: 40%;
    height: 100%;
    background: #ffffff;
    animation: barSweep 1.1s ease-in-out infinite;
  }
  @keyframes barSweep{
    0%{ left: -40%; }
    100%{ left: 100%; }
  }

  #screen-loading p{
    color: var(--muted);
    font-size:13px;
    margin:0;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }
  #screen-loading p .dots::after{
    content: '';
    animation: dotcycle 1.2s steps(4) infinite;
  }
  @keyframes dotcycle{
    0%{ content: ''; }
    25%{ content: '.'; }
    50%{ content: '..'; }
    75%{ content: '...'; }
    100%{ content: ''; }
  }

  /* ---------- Shared card ---------- */
  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
  }
  .card h1{
    font-family: 'Bebas Neue', 'Sarabun', sans-serif;
    font-size: 30px;
    letter-spacing: 1px;
    margin: 0 0 4px;
    font-weight:400;
  }
  .card .sub{
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }

  label{
    display:block;
    font-size: 13px;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  label:first-of-type{ margin-top:0; }

  input[type=text], input[type=password], textarea{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, textarea:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
  }
  textarea{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.55;
    resize: vertical;
    min-height: 220px;
  }

  .btn{
    appearance:none;
    border: 1px solid #ffffff;
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight:600;
    font-family: inherit;
    cursor:pointer;
    transition: transform .08s ease, background .15s ease, color .15s ease, box-shadow .2s ease;
  }
  .btn:active{ transform: translateY(1px) scale(.98); }
  .btn-primary{ background: #ffffff; color:#000000; }
  .btn-primary:hover{ box-shadow: 0 0 18px rgba(255,255,255,0.35); transform: translateY(-1px); }
  .btn-ghost{ background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn-ghost:hover{ border-color:#ffffff; box-shadow: 0 0 14px rgba(255,255,255,0.18); transform: translateY(-1px); }
  .btn-block{ width:100%; margin-top: 22px; }
  .btn-row{ display:flex; gap:10px; margin-top: 22px; }
  .btn-row .btn{ flex:1; }

  .switch-line{
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
    text-align:center;
  }
  .switch-line a{ color: #ffffff; text-decoration:none; cursor:pointer; border-bottom: 1px solid transparent; }
  .switch-line a:hover{ border-bottom-color: #ffffff; }

  .msg{
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-top: 14px;
    display:none;
  }
  .msg.show{ display:block; animation: msgPop .25s ease both; }
  @keyframes msgPop{
    from{ opacity:0; transform: translateY(-4px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .msg.err{ background: rgba(255,92,92,0.1); color: var(--danger); border: 1px solid rgba(255,92,92,0.3); }
  .msg.ok{ background: rgba(255,255,255,0.08); color: #ffffff; border: 1px solid rgba(255,255,255,0.3); }

  /* ---------- Vault ---------- */
  #screen-vault{ display:none; }
  .vault-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .vault-header .who{ font-size: 14px; color: var(--muted); }
  .vault-header .who b{ color: var(--text); font-weight:600; }

  .vault-grid{
    display:grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 18px;
  }
  @media (max-width: 640px){
    .vault-grid{ grid-template-columns: 1fr; }
  }

  .panel-title{
    font-family: 'Bebas Neue', 'Sarabun', sans-serif;
    font-size: 16px;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .snippet-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height: 420px;
    overflow-y:auto;
  }
  .snippet-item{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 8px;
    transition: border-color .15s ease, transform .15s ease;
    animation: itemIn .3s ease both;
  }
  .snippet-item:hover{ border-color: #ffffff; transform: translateX(2px); }
  @keyframes itemIn{
    from{ opacity: 0; transform: translateY(-4px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .snippet-item .name{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .snippet-item .actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    cursor:pointer;
    font-family: inherit;
    transition: all .15s ease;
  }
  .icon-btn:hover{ color:#000000; background:#ffffff; border-color:#ffffff; }
  .icon-btn.danger:hover{ color: #ffffff; background: var(--danger); border-color: var(--danger); }

  .empty-state{
    color: var(--muted);
    font-size: 13px;
    padding: 20px 4px;
    text-align:center;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }

  .toast{
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #ffffff;
    border: 1px solid #ffffff;
    color: #000000;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 5;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <!-- LOADING -->
  <div class="stage" id="screen-loading">
    <div class="victory-mark">VICTORY</div>
    <div class="loading-bar"></div>
    <p>Loeding<span class="dots"></span></p>
  </div>

  <!-- LOGIN -->
  <div class="stage" id="screen-login" style="display:none;">
    <div class="card">
      <h1>เข้าสู่ระบบ</h1>
      <p class="sub">เก็บโค้ดของคุณไว้ในที่เดียว แก้ไขได้ทุกเมื่อ</p>

      <label for="login-user">ชื่อผู้ใช้</label>
      <input type="text" id="login-user" autocomplete="username">

      <label for="login-pass">รหัสผ่าน</label>
      <input type="password" id="login-pass" autocomplete="current-password">

      <button class="btn btn-primary btn-block" onclick="handleLogin()">เข้าสู่ระบบ</button>
      <div class="msg" id="login-msg"></div>

      <p class="switch-line">ยังไม่มีบัญชี? <a onclick="showScreen('signup')">สมัครสมาชิก</a></p>
    </div>
  </div>

  <!-- SIGNUP -->
  <div class="stage" id="screen-signup" style="display:none;">
    <div class="card">
      <h1>สมัครสมาชิก</h1>
      <p class="sub">สร้างบัญชีใหม่เพื่อเริ่มเก็บโค้ด</p>

      <label for="signup-user">ชื่อผู้ใช้</label>
      <input type="text" id="signup-user" autocomplete="username">

      <label for="signup-pass">รหัสผ่าน</label>
      <input type="password" id="signup-pass" autocomplete="new-password">

      <label for="signup-pass2">ยืนยันรหัสผ่าน</label>
      <input type="password" id="signup-pass2" autocomplete="new-password">

      <button class="btn btn-primary btn-block" onclick="handleSignup()">สมัครสมาชิก</button>
      <div class="msg" id="signup-msg"></div>

      <p class="switch-line">มีบัญชีอยู่แล้ว? <a onclick="showScreen('login')">เข้าสู่ระบบ</a></p>
    </div>
  </div>

  <!-- VAULT -->
  <div class="stage wide" id="screen-vault">
    <div class="vault-header">
      <div class="who">เข้าสู่ระบบเป็น <b id="who-name">-</b></div>
      <button class="btn btn-ghost" onclick="handleLogout()">ออกจากระบบ</button>
    </div>

    <div class="vault-grid">
      <div class="card">
        <p class="panel-title" id="editor-mode-label">เพิ่มโค้ดใหม่</p>

        <label for="snippet-name">ชื่อโค้ด</label>
        <input type="text" id="snippet-name" placeholder="เช่น login-script, css-reset">

        <label for="snippet-code">โค้ด</label>
        <textarea id="snippet-code" placeholder="วางหรือพิมพ์โค้ดของคุณที่นี่..."></textarea>

        <div class="btn-row">
          <button class="btn btn-primary" onclick="saveSnippet()">บันทึก</button>
          <button class="btn btn-ghost" onclick="copyCurrentCode()">คัดลอกโค้ด</button>
        </div>
        <div class="msg" id="vault-msg"></div>
      </div>

      <div class="card">
        <p class="panel-title">โค้ดที่บันทึกไว้</p>
        <div class="snippet-list" id="snippet-list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  let currentUser = null;
  let editingName = null; // name currently loaded into the editor, if any

  function showScreen(name){
    document.getElementById('screen-loading').style.display = 'none';
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-signup').style.display = 'none';
    document.getElementById('screen-vault').style.display = 'none';
    const el = document.getElementById('screen-' + name);
    el.style.display = 'block';
    el.classList.remove('entering');
    void el.offsetWidth; // restart animation
    el.classList.add('entering');
  }

  function showMsg(id, text, type){
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg show ' + type;
  }
  function clearMsg(id){
    const el = document.getElementById(id);
    el.className = 'msg';
  }

  function toast(text){
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => showScreen('login'), 900);
  });

  // ---------- Local storage "database" ----------
  // Everything lives in one localStorage key so the page works as a
  // plain standalone website (no server, no external account needed).
  const DB_KEY = 'codevault_db_v1';

  function loadDb(){
    try{
      const raw = localStorage.getItem(DB_KEY);
      if(!raw) return { users: {}, snippets: {} };
      const parsed = JSON.parse(raw);
      if(!parsed.users) parsed.users = {};
      if(!parsed.snippets) parsed.snippets = {};
      return parsed;
    }catch(e){
      return { users: {}, snippets: {} };
    }
  }

  function saveDb(db){
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  }

  // ---------- Auth ----------
  async function handleSignup(){
    clearMsg('signup-msg');
    const user = document.getElementById('signup-user').value.trim();
    const pass = document.getElementById('signup-pass').value;
    const pass2 = document.getElementById('signup-pass2').value;

    if(!user || !pass){
      showMsg('signup-msg', 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน', 'err');
      return;
    }
    if(pass !== pass2){
      showMsg('signup-msg', 'รหัสผ่านไม่ตรงกัน', 'err');
      return;
    }

    try{
      const db = loadDb();

      if(db.users[user]){
        showMsg('signup-msg', 'มีชื่อผู้ใช้นี้อยู่แล้ว', 'err');
        return;
      }

      db.users[user] = { password: pass, createdAt: Date.now() };
      saveDb(db);

      showMsg('signup-msg', 'สมัครสมาชิกสำเร็จ กำลังพาไปหน้าเข้าสู่ระบบ...', 'ok');
      setTimeout(() => {
        document.getElementById('login-user').value = user;
        showScreen('login');
      }, 900);
    }catch(err){
      showMsg('signup-msg', 'สมัครสมาชิกไม่สำเร็จ เบราว์เซอร์นี้อาจไม่รองรับการเก็บข้อมูล', 'err');
    }
  }

  async function handleLogin(){
    clearMsg('login-msg');
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;

    if(!user || !pass){
      showMsg('login-msg', 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน', 'err');
      return;
    }

    try{
      const db = loadDb();
      const record = db.users[user];

      if(!record){
        showMsg('login-msg', 'ไม่พบบัญชีนี้ ลองสมัครสมาชิกก่อน', 'err');
        return;
      }
      if(record.password !== pass){
        showMsg('login-msg', 'รหัสผ่านไม่ถูกต้อง', 'err');
        return;
      }

      currentUser = user;
      document.getElementById('who-name').textContent = user;
      showScreen('vault');
      resetEditor();
      loadSnippetList();
    }catch(err){
      showMsg('login-msg', 'เข้าสู่ระบบไม่สำเร็จ เบราว์เซอร์นี้อาจไม่รองรับการเก็บข้อมูล', 'err');
    }
  }

  function handleLogout(){
    currentUser = null;
    editingName = null;
    document.getElementById('login-user').value = '';
    document.getElementById('login-pass').value = '';
    showScreen('login');
  }

  // ---------- Vault ----------
  function resetEditor(){
    editingName = null;
    document.getElementById('snippet-name').value = '';
    document.getElementById('snippet-code').value = '';
    document.getElementById('editor-mode-label').textContent = 'เพิ่มโค้ดใหม่';
    clearMsg('vault-msg');
  }

  function saveSnippet(){
    clearMsg('vault-msg');
    const name = document.getElementById('snippet-name').value.trim();
    const code = document.getElementById('snippet-code').value;

    if(!name){
      showMsg('vault-msg', 'กรุณาตั้งชื่อโค้ดก่อนบันทึก', 'err');
      return;
    }
    if(!code){
      showMsg('vault-msg', 'ยังไม่มีโค้ดให้บันทึก', 'err');
      return;
    }

    try{
      const db = loadDb();
      if(!db.snippets[currentUser]) db.snippets[currentUser] = {};
      db.snippets[currentUser][name] = { code: code, updatedAt: Date.now() };
      saveDb(db);

      editingName = name;
      document.getElementById('editor-mode-label').textContent = 'กำลังแก้ไข: ' + name;
      showMsg('vault-msg', 'บันทึกแล้ว', 'ok');
      toast('บันทึก "' + name + '" เรียบร้อย');
      loadSnippetList();
    }catch(err){
      showMsg('vault-msg', 'บันทึกไม่สำเร็จ เบราว์เซอร์นี้อาจไม่รองรับการเก็บข้อมูล', 'err');
    }
  }

  async function copyCurrentCode(){
    const code = document.getElementById('snippet-code').value;
    if(!code){
      showMsg('vault-msg', 'ไม่มีโค้ดให้คัดลอก', 'err');
      return;
    }
    try{
      await navigator.clipboard.writeText(code);
      toast('คัดลอกโค้ดแล้ว');
    }catch(err){
      showMsg('vault-msg', 'คัดลอกไม่สำเร็จ กรุณาคัดลอกด้วยตนเอง', 'err');
    }
  }

  function loadSnippetList(){
    const listEl = document.getElementById('snippet-list');

    try{
      const db = loadDb();
      const userSnippets = db.snippets[currentUser] || {};
      const names = Object.keys(userSnippets);

      if(names.length === 0){
        listEl.innerHTML = '<div class="empty-state">ยังไม่มีโค้ดที่บันทึกไว้</div>';
        return;
      }

      listEl.innerHTML = '';
      names.sort().forEach((name) => {
        const item = document.createElement('div');
        item.className = 'snippet-item';
        item.innerHTML =
          '<span class="name">' + escapeHtml(name) + '</span>' +
          '<span class="actions">' +
            '<button class="icon-btn" data-action="edit">Rew</button>' +
            '<button class="icon-btn danger" data-action="delete">ลบ</button>' +
          '</span>';
        item.querySelector('[data-action="edit"]').onclick = () => loadSnippetIntoEditor(name);
        item.querySelector('[data-action="delete"]').onclick = () => deleteSnippet(name);
        listEl.appendChild(item);
      });
    }catch(err){
      listEl.innerHTML = '<div class="empty-state">โหลดรายการไม่สำเร็จ</div>';
    }
  }

  function loadSnippetIntoEditor(name){
    try{
      const db = loadDb();
      const record = (db.snippets[currentUser] || {})[name];
      if(!record){
        showMsg('vault-msg', 'ไม่พบโค้ดนี้แล้ว', 'err');
        loadSnippetList();
        return;
      }
      editingName = name;
      document.getElementById('snippet-name').value = name;
      document.getElementById('snippet-code').value = record.code;
      document.getElementById('editor-mode-label').textContent = 'กำลังแก้ไข: ' + name;
      clearMsg('vault-msg');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }catch(err){
      showMsg('vault-msg', 'โหลดโค้ดไม่สำเร็จ', 'err');
    }
  }

  function deleteSnippet(name){
    try{
      const db = loadDb();
      if(db.snippets[currentUser]){
        delete db.snippets[currentUser][name];
        saveDb(db);
      }
      toast('ลบ "' + name + '" แล้ว');
      if(editingName === name){
        resetEditor();
      }
      loadSnippetList();
    }catch(err){
      showMsg('vault-msg', 'ลบไม่สำเร็จ', 'err');
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
