<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Vault</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #12151b;
    --panel: #1a1f28;
    --panel-2: #212733;
    --line: #2a3140;
    --text: #e8eaf0;
    --muted: #8892a4;
    --accent: #5eead4;
    --accent-dim: #2f6f66;
    --warn: #f0a35e;
    --danger: #e06767;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Sarabun', system-ui, sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px;
  }

  .stage{ width:100%; max-width: 460px; }
  .stage.wide{ max-width: 860px; }

  /* ---------- Loading ---------- */
  #screen-loading{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    text-align:center;
  }
  .mark{
    width:46px; height:46px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:600; color:#0d1013; font-size:20px;
  }
  .spinner{
    width:22px; height:22px;
    border-radius:50%;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #screen-loading p{ color: var(--muted); font-size:14px; margin:0; }

  /* ---------- Shared card ---------- */
  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
  }
  .card h1{
    font-size: 22px;
    margin: 0 0 4px;
    font-weight:600;
  }
  .card .sub{
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }

  label{
    display:block;
    font-size: 13px;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  label:first-of-type{ margin-top:0; }

  input[type=text], input[type=password], textarea{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  input:focus, textarea:focus{
    border-color: var(--accent);
  }
  textarea{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.55;
    resize: vertical;
    min-height: 220px;
  }

  .btn{
    appearance:none;
    border:none;
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight:600;
    font-family: inherit;
    cursor:pointer;
    transition: transform .05s ease, filter .15s ease;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--accent); color:#0d1013; }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-ghost{ background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn-ghost:hover{ border-color: var(--accent); }
  .btn-block{ width:100%; margin-top: 22px; }
  .btn-row{ display:flex; gap:10px; margin-top: 22px; }
  .btn-row .btn{ flex:1; }

  .switch-line{
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
    text-align:center;
  }
  .switch-line a{ color: var(--accent); text-decoration:none; cursor:pointer; }
  .switch-line a:hover{ text-decoration: underline; }

  .msg{
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-top: 14px;
    display:none;
  }
  .msg.show{ display:block; }
  .msg.err{ background: rgba(224,103,103,0.12); color: var(--danger); border: 1px solid rgba(224,103,103,0.3); }
  .msg.ok{ background: rgba(94,234,212,0.1); color: var(--accent); border: 1px solid rgba(94,234,212,0.3); }

  /* ---------- Vault ---------- */
  #screen-vault{ display:none; }
  .vault-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .vault-header .who{ font-size: 14px; color: var(--muted); }
  .vault-header .who b{ color: var(--text); font-weight:600; }

  .vault-grid{
    display:grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 18px;
  }
  @media (max-width: 640px){
    .vault-grid{ grid-template-columns: 1fr; }
  }

  .panel-title{
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .snippet-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height: 420px;
    overflow-y:auto;
  }
  .snippet-item{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 8px;
  }
  .snippet-item .name{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .snippet-item .actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    cursor:pointer;
    font-family: inherit;
  }
  .icon-btn:hover{ color: var(--accent); border-color: var(--accent); }
  .icon-btn.danger:hover{ color: var(--danger); border-color: var(--danger); }

  .empty-state{
    color: var(--muted);
    font-size: 13px;
    padding: 20px 4px;
    text-align:center;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }

  .toast{
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--panel-2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <!-- LOADING -->
  <div class="stage" id="screen-loading">
    <div class="mark">CV</div>
    <div class="spinner"></div>
    <p>กำลังเปิด Code Vault...</p>
  </div>

  <!-- LOGIN -->
  <div class="stage" id="screen-login" style="display:none;">
    <div class="card">
      <h1>เข้าสู่ระบบ</h1>
      <p class="sub">เก็บโค้ดของคุณไว้ในที่เดียว แก้ไขได้ทุกเมื่อ</p>

      <label for="login-user">ชื่อผู้ใช้</label>
      <input type="text" id="login-user" autocomplete="username">

      <label for="login-pass">รหัสผ่าน</label>
      <input type="password" id="login-pass" autocomplete="current-password">

      <button class="btn btn-primary btn-block" onclick="handleLogin()">เข้าสู่ระบบ</button>
      <div class="msg" id="login-msg"></div>

      <p class="switch-line">ยังไม่มีบัญชี? <a onclick="showScreen('signup')">สมัครสมาชิก</a></p>
    </div>
  </div>

  <!-- SIGNUP -->
  <div class="stage" id="screen-signup" style="display:none;">
    <div class="card">
      <h1>สมัครสมาชิก</h1>
      <p class="sub">สร้างบัญชีใหม่เพื่อเริ่มเก็บโค้ด</p>

      <label for="signup-user">ชื่อผู้ใช้</label>
      <input type="text" id="signup-user" autocomplete="username">

      <label for="signup-pass">รหัสผ่าน</label>
      <input type="password" id="signup-pass" autocomplete="new-password">

      <label for="signup-pass2">ยืนยันรหัสผ่าน</label>
      <input type="password" id="signup-pass2" autocomplete="new-password">

      <button class="btn btn-primary btn-block" onclick="handleSignup()">สมัครสมาชิก</button>
      <div class="msg" id="signup-msg"></div>

      <p class="switch-line">มีบัญชีอยู่แล้ว? <a onclick="showScreen('login')">เข้าสู่ระบบ</a></p>
    </div>
  </div>

  <!-- VAULT -->
  <div class="stage wide" id="screen-vault">
    <div class="vault-header">
      <div class="who">เข้าสู่ระบบเป็น <b id="who-name">-</b></div>
      <button class="btn btn-ghost" onclick="handleLogout()">ออกจากระบบ</button>
    </div>

    <div class="vault-grid">
      <div class="card">
        <p class="panel-title" id="editor-mode-label">เพิ่มโค้ดใหม่</p>

        <label for="snippet-name">ชื่อโค้ด</label>
        <input type="text" id="snippet-name" placeholder="เช่น login-script, css-reset">

        <label for="snippet-code">โค้ด</label>
        <textarea id="snippet-code" placeholder="วางหรือพิมพ์โค้ดของคุณที่นี่..."></textarea>

        <div class="btn-row">
          <button class="btn btn-primary" onclick="saveSnippet()">บันทึก</button>
          <button class="btn btn-ghost" onclick="copyCurrentCode()">คัดลอกโค้ด</button>
        </div>
        <div class="msg" id="vault-msg"></div>
      </div>

      <div class="card">
        <p class="panel-title">โค้ดที่บันทึกไว้</p>
        <div class="snippet-list" id="snippet-list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  let currentUser = null;
  let editingName = null; // name currently loaded into the editor, if any

  function showScreen(name){
    document.getElementById('screen-loading').style.display = 'none';
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-signup').style.display = 'none';
    document.getElementById('screen-vault').style.display = 'none';
    document.getElementById('screen-' + name).style.display = 'block';
  }

  function showMsg(id, text, type){
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg show ' + type;
  }
  function clearMsg(id){
    const el = document.getElementById(id);
    el.className = 'msg';
  }

  function toast(text){
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => showScreen('login'), 900);
  });

  // ---------- Local storage "database" ----------
  // Everything lives in one localStorage key so the page works as a
  // plain standalone website (no server, no external account needed).
  const DB_KEY = 'codevault_db_v1';

  function loadDb(){
    try{
      const raw = localStorage.getItem(DB_KEY);
      if(!raw) return { users: {}, snippets: {} };
      const parsed = JSON.parse(raw);
      if(!parsed.users) parsed.users = {};
      if(!parsed.snippets) parsed.snippets = {};
      return parsed;
    }catch(e){
      return { users: {}, snippets: {} };
    }
  }

  function saveDb(db){
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  }

  // ---------- Auth ----------
  async function handleSignup(){
    clearMsg('signup-msg');
    const user = document.getElementById('signup-user').value.trim();
    const pass = document.getElementById('signup-pass').value;
    const pass2 = document.getElementById('signup-pass2').value;

    if(!user || !pass){
      showMsg('signup-msg', 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน', 'err');
      return;
    }
    if(pass !== pass2){
      showMsg('signup-msg', 'รหัสผ่านไม่ตรงกัน', 'err');
      return;
    }

    try{
      const db = loadDb();

      if(db.users[user]){
        showMsg('signup-msg', 'มีชื่อผู้ใช้นี้อยู่แล้ว', 'err');
        return;
      }

      db.users[user] = { password: pass, createdAt: Date.now() };
      saveDb(db);

      showMsg('signup-msg', 'สมัครสมาชิกสำเร็จ กำลังพาไปหน้าเข้าสู่ระบบ...', 'ok');
      setTimeout(() => {
        document.getElementById('login-user').value = user;
        showScreen('login');
      }, 900);
    }catch(err){
      showMsg('signup-msg', 'สมัครสมาชิกไม่สำเร็จ เบราว์เซอร์นี้อาจไม่รองรับการเก็บข้อมูล', 'err');
    }
  }

  async function handleLogin(){
    clearMsg('login-msg');
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;

    if(!user || !pass){
      showMsg('login-msg', 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน', 'err');
      return;
    }

    try{
      const db = loadDb();
      const record = db.users[user];

      if(!record){
        showMsg('login-msg', 'ไม่พบบัญชีนี้ ลองสมัครสมาชิกก่อน', 'err');
        return;
      }
      if(record.password !== pass){
        showMsg('login-msg', 'รหัสผ่านไม่ถูกต้อง', 'err');
        return;
      }

      currentUser = user;
      document.getElementById('who-name').textContent = user;
      showScreen('vault');
      resetEditor();
      loadSnippetList();
    }catch(err){
      showMsg('login-msg', 'เข้าสู่ระบบไม่สำเร็จ เบราว์เซอร์นี้อาจไม่รองรับการเก็บข้อมูล', 'err');
    }
  }

  function handleLogout(){
    currentUser = null;
    editingName = null;
    document.getElementById('login-user').value = '';
    document.getElementById('login-pass').value = '';
    showScreen('login');
  }

  // ---------- Vault ----------
  function resetEditor(){
    editingName = null;
    document.getElementById('snippet-name').value = '';
    document.getElementById('snippet-code').value = '';
    document.getElementById('editor-mode-label').textContent = 'เพิ่มโค้ดใหม่';
    clearMsg('vault-msg');
  }

  function saveSnippet(){
    clearMsg('vault-msg');
    const name = document.getElementById('snippet-name').value.trim();
    const code = document.getElementById('snippet-code').value;

    if(!name){
      showMsg('vault-msg', 'กรุณาตั้งชื่อโค้ดก่อนบันทึก', 'err');
      return;
    }
    if(!code){
      showMsg('vault-msg', 'ยังไม่มีโค้ดให้บันทึก', 'err');
      return;
    }

    try{
      const db = loadDb();
      if(!db.snippets[currentUser]) db.snippets[currentUser] = {};
      db.snippets[currentUser][name] = { code: code, updatedAt: Date.now() };
      saveDb(db);

      editingName = name;
      document.getElementById('editor-mode-label').textContent = 'กำลังแก้ไข: ' + name;
      showMsg('vault-msg', 'บันทึกแล้ว', 'ok');
      toast('บันทึก "' + name + '" เรียบร้อย');
      loadSnippetList();
    }catch(err){
      showMsg('vault-msg', 'บันทึกไม่สำเร็จ เบราว์เซอร์นี้อาจไม่รองรับการเก็บข้อมูล', 'err');
    }
  }

  async function copyCurrentCode(){
    const code = document.getElementById('snippet-code').value;
    if(!code){
      showMsg('vault-msg', 'ไม่มีโค้ดให้คัดลอก', 'err');
      return;
    }
    try{
      await navigator.clipboard.writeText(code);
      toast('คัดลอกโค้ดแล้ว');
    }catch(err){
      showMsg('vault-msg', 'คัดลอกไม่สำเร็จ กรุณาคัดลอกด้วยตนเอง', 'err');
    }
  }

  function loadSnippetList(){
    const listEl = document.getElementById('snippet-list');

    try{
      const db = loadDb();
      const userSnippets = db.snippets[currentUser] || {};
      const names = Object.keys(userSnippets);

      if(names.length === 0){
        listEl.innerHTML = '<div class="empty-state">ยังไม่มีโค้ดที่บันทึกไว้</div>';
        return;
      }

      listEl.innerHTML = '';
      names.sort().forEach((name) => {
        const item = document.createElement('div');
        item.className = 'snippet-item';
        item.innerHTML =
          '<span class="name">' + escapeHtml(name) + '</span>' +
          '<span class="actions">' +
            '<button class="icon-btn" data-action="edit">Rew</button>' +
            '<button class="icon-btn danger" data-action="delete">ลบ</button>' +
          '</span>';
        item.querySelector('[data-action="edit"]').onclick = () => loadSnippetIntoEditor(name);
        item.querySelector('[data-action="delete"]').onclick = () => deleteSnippet(name);
        listEl.appendChild(item);
      });
    }catch(err){
      listEl.innerHTML = '<div class="empty-state">โหลดรายการไม่สำเร็จ</div>';
    }
  }

  function loadSnippetIntoEditor(name){
    try{
      const db = loadDb();
      const record = (db.snippets[currentUser] || {})[name];
      if(!record){
        showMsg('vault-msg', 'ไม่พบโค้ดนี้แล้ว', 'err');
        loadSnippetList();
        return;
      }
      editingName = name;
      document.getElementById('snippet-name').value = name;
      document.getElementById('snippet-code').value = record.code;
      document.getElementById('editor-mode-label').textContent = 'กำลังแก้ไข: ' + name;
      clearMsg('vault-msg');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }catch(err){
      showMsg('vault-msg', 'โหลดโค้ดไม่สำเร็จ', 'err');
    }
  }

  function deleteSnippet(name){
    try{
      const db = loadDb();
      if(db.snippets[currentUser]){
        delete db.snippets[currentUser][name];
        saveDb(db);
      }
      toast('ลบ "' + name + '" แล้ว');
      if(editingName === name){
        resetEditor();
      }
      loadSnippetList();
    }catch(err){
      showMsg('vault-msg', 'ลบไม่สำเร็จ', 'err');
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
